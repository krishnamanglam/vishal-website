    <path d="M32 24 C37 30 38 37 32 46 C26 37 27 30 32 24 Z" fill="url(#po)" transform="rotate(-70 32 46)"/>
    <path d="M32 24 C37 30 38 37 32 46 C26 37 27 30 32 24 Z" fill="url(#po)" transform="rotate(70 32 46)"/>
