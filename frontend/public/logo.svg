    <path d="M32 16 C38.5 24 40 34 32 46 C24 34 25.5 24 32 16 Z" fill="url(#ps)" transform="rotate(-36 32 46)"/>
    <path d="M32 16 C38.5 24 40 34 32 46 C24 34 25.5 24 32 16 Z" fill="url(#ps)" transform="rotate(36 32 46)"/>
