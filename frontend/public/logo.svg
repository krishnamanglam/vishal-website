  <!-- base -->
  <path d="M13 44.5 C21 51.5 43 51.5 51 44.5 C44 48 20 48 13 44.5 Z" fill="#be185d"/>
  <circle cx="32" cy="45" r="2.2" fill="#facc15"/>
