# Render Blueprint: one web service + a persistent disk for the database.
# A persistent disk needs a paid instance (starter). Without a disk, all
# requests and settings are lost on every restart or redeploy.
services:
  - type: web
    name: subh-sheva-sansthan
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD   # you type this in the Render dashboard
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL     # your site address, e.g. https://subh-sheva-sansthan.onrender.com
        sync: false
      - key: UPI_ID           # e.g. yourshop@upi
        sync: false
      - key: PAYEE_NAME
        value: Subh Sheva Sansthan
      - key: NOTIFY_PROVIDER
        value: none
